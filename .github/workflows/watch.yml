name: Kino watchdog

on:
  schedule:
    - cron: "4,17,29,43,56 * * * *"   # GitHub to reálne spúšťa cca každých 5–15 min
  workflow_dispatch:         # možnosť spustiť ručne cez tlačidlo

permissions:
  contents: write            # aby workflow mohol commitnúť kino_state.json

concurrency:
  group: kino-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run watchdog
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python3 kino_watchdog.py

      - name: Commit state
        run: |
          git config user.name "kino-bot"
          git config user.email "kino-bot@users.noreply.github.com"
          git add kino_state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
